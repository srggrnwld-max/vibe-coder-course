<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Чек {{ order.order_id }}</title>
  <style>
    @page {
      size: A5;
      margin: 16mm;
    }

    body {
      font-family: sans-serif;
      color: #1a1a1a;
      font-size: 12px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .meta {
      margin: 0 0 16px;
      color: #444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 6px 4px;
      text-align: left;
      border-bottom: 1px solid #ccc;
    }

    th.num,
    td.num {
      text-align: right;
    }

    tfoot td {
      border-bottom: none;
      font-weight: bold;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Чек № {{ order.order_id }}</h1>
  <p class="meta">{{ order.date }} · {{ order.customer }}</p>

  <table>
    <thead>
      <tr>
        <th>Товар</th>
        <th class="num">Кол-во</th>
        <th class="num">Цена</th>
        <th class="num">Сумма</th>
      </tr>
    </thead>
    <tbody>
      {% for item in order["items"] %}
      <tr>
        <td>{{ item.item }}</td>
        <td class="num">{{ item.quantity }}</td>
        <td class="num">{{ "%.2f"|format(item.price) }}</td>
        <td class="num">{{ "%.2f"|format(item.line_total) }}</td>
      </tr>
      {% endfor %}
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3">Итого</td>
        <td class="num">{{ "%.2f"|format(order.total) }}</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
